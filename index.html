<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA TV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"></div>
<header id="top">
  <div id="time">--:--</div>
  <div id="date"></div>
  <div id="hello"></div>
</header>
<div class="pill" id="net"></div>
<main>
  <section class="screen" id="home"><nav id="shelf" aria-label="Applications"></nav></section>
  <section class="screen scroll" id="media" hidden></section>
  <section class="screen scroll" id="browser" hidden></section>
  <section class="screen scroll" id="settings" hidden></section>
  <section class="screen scroll" id="youtube" hidden></section>
  <section class="screen scroll" id="spotify" hidden></section>
</main>
<div id="player" hidden>
  <div class="pv"></div>
  <div class="pbar"><h2></h2><div class="trk"><i></i></div><p></p></div>
</div>
<div id="emb" hidden><button id="embBack" type="button">← Retour</button><h2></h2><div class="frame"></div><p></p></div>
<div id="vol"></div>
<div id="toast" role="status"></div>
<footer id="hints">Flèches : naviguer &nbsp; Entrée : ouvrir &nbsp; Échap : retour &nbsp; Page↑ / Page↓ : volume</footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
